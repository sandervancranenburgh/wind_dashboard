name: Deploy current dashboard without Git artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download the public snapshot from the portal
        env:
          BUNDLE_URL: ${{ vars.WIND_DASHBOARD_BUNDLE_URL }}
        run: |
          test -n "$BUNDLE_URL"
          curl --fail --show-error --silent --retry 3 --max-time 60 --max-filesize 67108864 --proto '=https' --tlsv1.2 "$BUNDLE_URL" --output "$RUNNER_TEMP/dashboard.zip"
          python -m next_day_wind_model.dashboard_publication extract --bundle "$RUNNER_TEMP/dashboard.zip" --destination "$RUNNER_TEMP/dashboard-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/dashboard-site
          retention-days: 1

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the validated snapshot
        id: deployment
        uses: actions/deploy-pages@v4
